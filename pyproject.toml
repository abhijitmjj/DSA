[project]
name = "dsa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.4"
dependencies = [
    "azure-ai-ml>=1.27.1",
    "azure-identity>=1.23.0",
    "equinox>=0.12.2",
    "ipython>=9.2.0",
    "jax[cuda12]>=0.6.1",
    "jupyterlab>=4.4.2",
    "pytest>=8.4.0",
    "pytest-mock>=3.14.1",
]

[tool.pyrefly]
project-includes = ["**/*"]
project-excludes = ["**/*venv/**/*"]

[dependency-groups]
dev = [
    "ipympl>=0.9.7",
    "ipython>=9.3.0",
    "jupyter>=1.1.1",
    "jupyterlab>=4.4.3",
    "pyre-check>=0.9.23",
    "pyrefly>=0.19.1",
]

